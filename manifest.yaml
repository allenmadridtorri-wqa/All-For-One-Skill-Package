name: all-for-one
displayName: "All-For-One — AI Game Development Engineering Framework"
version: 2.0.0
license: Apache-2.0
description: >-
  Engine-aware multi-specialist AI game development framework coordinating
  CRAZYMAKER (Game Director), CRAZYDESIGNER (Visual Director), CRAZY CODER
  (Engineering Director), and CRAZY QA (Quality Assurance Director) via /crazy
  across Claude, Google Antigravity, and ChatGPT/Codex.

commands:
  - name: crazy
    skill: skills/crazy/SKILL.md
    role: "Unified Multi-Specialist Orchestrator"
  - name: crazymaker
    skill: skills/crazymaker/SKILL.md
    role: "Game Director"
  - name: crazydesigner
    skill: skills/crazydesigner/SKILL.md
    role: "Visual Director"
  - name: crazycoder
    skill: skills/crazycoder/SKILL.md
    role: "Engineering Director"
  - name: crazyqa
    skill: skills/crazyqa/SKILL.md
    role: "Quality Assurance Director"

supportedEngines:
  - unreal5
  - unity
  - godot
  - threejs
  - cpp-native
  - rust

extensionHooks:
  - audio_engineering
  - multiplayer_networking
  - world_generation
  - technical_art
  - animation
  - build_engineering
  - narrative_design

targets:
  claude:
    workspaceSkillsDir: .claude/skills
    globalSkillsDir: ~/.claude/skills
    distDir: dist/claude
    bundleZip: true
  antigravity:
    workspaceSkillsDir: .agent/skills/all-for-one
    workspaceWorkflowsDir: .agent/workflows
    globalSkillsDir: ~/.gemini/antigravity/skills/all-for-one
    globalWorkflowsDir: ~/.gemini/antigravity/global_workflows
    distDir: dist/antigravity
  chatgpt:
    workspaceSkillsDir: .agents/skills
    globalSkillsDir: ~/.codex/skills
    distDir: dist/chatgpt
    customGptBundle: dist/chatgpt/custom-gpt

shared:
  coreDir: core
  referencesDir: references
  referencesIndex: references/index.json
  scriptsDir: scripts
  assetsDir: assets
  evalsDir: evals
