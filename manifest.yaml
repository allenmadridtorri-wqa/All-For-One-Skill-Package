name: all-for-one
displayName: "All-For-One V3.2 — 130-Year Expertise Single-AI Engineering & Creative Production Framework"
version: 3.2.0
license: Apache-2.0
description: >-
  Single-AI-first engineering and photorealistic creative production framework
  combining 40-year AAA game direction (CRAZYMAKER), 40-year Hollywood 3D/VFX
  production (CRAZYDESIGNER), 50-year principal software/engine architecture
  (CRAZYCODER), T4 Colab Drive orchestration, and independent QA (CRAZYQA).

commands:
  - name: crazy
    skill: skills/crazy/SKILL.md
    role: "Unified Multi-Specialist Orchestrator"
  - name: crazymaker
    skill: skills/crazymaker/SKILL.md
    role: "Game Director & Technical Producer"
  - name: crazydesigner
    skill: skills/crazydesigner/SKILL.md
    role: "Visual, 3D & Blender Production Director"
  - name: crazycoder
    skill: skills/crazycoder/SKILL.md
    role: "Engineering Director"
  - name: crazyqa
    skill: skills/crazyqa/SKILL.md
    role: "Independent Quality Assurance & Security Director"

supportedEngines:
  - unreal5
  - unity
  - godot
  - threejs
  - cpp-native
  - rust
  - web-fullstack
  - general-software

extensionHooks:
  - audio_engineering
  - multiplayer_networking
  - world_generation
  - technical_art
  - animation
  - build_engineering
  - narrative_design

targets:
  claude:
    workspaceSkillsDir: .claude/skills
    globalSkillsDir: ~/.claude/skills
    distDir: dist/claude
    bundleZip: true
  antigravity:
    workspaceSkillsDir: .agent/skills/all-for-one
    workspaceWorkflowsDir: .agent/workflows
    workspaceRulesDir: .agent/rules
    globalSkillsDir: ~/.gemini/antigravity/skills/all-for-one
    globalWorkflowsDir: ~/.gemini/antigravity/global_workflows
    globalRulesDir: ~/.gemini/antigravity/rules
    distDir: dist/antigravity
  chatgpt:
    workspaceSkillsDir: .agents/skills
    globalSkillsDir: ~/.codex/skills
    distDir: dist/chatgpt
    customGptBundle: dist/chatgpt/custom-gpt
  cursor:
    workspaceRulesDir: .cursor/rules
    distDir: dist/targets/cursor
  windsurf:
    workspaceRulesDir: .windsurf/rules
    workspaceWorkflowsDir: .windsurf/workflows
    distDir: dist/targets/windsurf
  cline:
    workspaceRulesDir: .clinerules
    distDir: dist/targets/cline
  copilot:
    workspaceInstructionsFile: .github/copilot-instructions.md
    distDir: dist/targets/copilot
  gemini-cli:
    workspaceInstructionsFile: .gemini/GEMINI.md
    workspaceSkillsDir: .gemini/skills
    distDir: dist/targets/gemini-cli
  opencode:
    workspaceInstructionsFile: AGENTS.md
    workspaceSkillsDir: .opencode/skills
    distDir: dist/targets/opencode

shared:
  coreDir: core
  referencesDir: references
  referencesIndex: references/index.json
  scriptsDir: scripts
  assetsDir: assets
  evalsDir: evals
